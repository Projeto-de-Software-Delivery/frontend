name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Testes e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Testes unitários e de integração (com cobertura)
        run: npm run test:coverage

      - name: Build de produção (garante que o build para deploy não quebra)
        run: npm run build
